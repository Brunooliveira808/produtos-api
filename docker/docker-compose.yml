services:
  mysql:
    image: mysql
    container_name: produtos-mysql
    env_file:
      - ../.env
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-produtosapi}
      - MYSQL_USER=${MYSQL_USER:-}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-}
    volumes:
      - dados_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - produtos-network

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: produtos-api
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-produtosapi}?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-root}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_FLYWAY_ENABLED=true
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - JWT_KEY=${JWT_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - produtos-network

volumes:
  dados_mysql:

networks:
  produtos-network:
    driver: bridge

# Enables the DATA.SQL for DATABASE by DOCKER
# spring.sql.init.mode=always
# spring.jpa.defer-datasource-initialization=true

spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/produtosapi?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.flyway.enabled=true

jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.key=${JWT_KEY}
